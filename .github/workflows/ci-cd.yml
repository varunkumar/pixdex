name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            agent/package-lock.json

      - name: Frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Worker
        working-directory: worker
        run: |
          npm ci
          # Throwaway values: tests only need the bindings to exist.
          printf 'INGEST_TOKEN=ci-ingest\nREAD_TOKEN=ci-read\n' > .dev.vars
          npm test

      - name: Agent
        working-directory: agent
        run: |
          npm ci
          npm run typecheck
          npm test

  deploy:
    # Only direct pushes to main (i.e. merges); PRs run the test job only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix worker

      - name: Apply D1 migrations and deploy the Worker
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy

      - name: Build frontend
        run: npm run build

      # Run from the repo root so wrangler picks up ./functions (the /api proxy).
      - name: Deploy Pages
        run: ./worker/node_modules/.bin/wrangler pages deploy dist --project-name pixdex --branch main
