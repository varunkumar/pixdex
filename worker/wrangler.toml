name = "pixdex-worker"
main = "src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pixdex"
database_id = "REPLACE_AFTER_RUNNING_wrangler_d1_create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "THUMBNAILS"
bucket_name = "pixdex-thumbnails"
